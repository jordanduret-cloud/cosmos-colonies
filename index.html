<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cosmos Colonies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Exo+2:wght@400;500;600&display=swap">
<style>
/* Layout : système 3D plein écran ; pages plein écran (colonie 2D, vaisseau, équipage, packs) entre le HUD et les onglets */
:root{
  --bg:#060a13;--panel:#0f1728;--panel2:#18233c;--line:#2a3b62;--fg:#e4eaf6;--mut:#8d9cba;
  --acc:#ffb547;--alien:#5fd9c9;--bad:#ff7a7a;--ok:#7be0a0;
  --c:#9aa8bf;--r:#4fa3ff;--e:#b77bff;--l:#ffb547;
  --disp:'Chakra Petch','Trebuchet MS',sans-serif;--body:'Barlow','Segoe UI',system-ui,sans-serif;
  --navh:58px;color-scheme:dark
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;pointer-events:auto;font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--line);border-radius:20px;background:rgba(15,23,40,.82);color:var(--fg);white-space:nowrap}
.lab.lock{color:var(--mut);border-style:dashed;background:rgba(6,10,19,.6)}
.lab.next{color:var(--acc);border-color:var(--acc)}

#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(6,10,19,.96) 55%,rgba(6,10,19,0))}
.brand{font-family:var(--disp);font-size:13px;letter-spacing:.2em;color:var(--mut)}
.brand b{color:var(--fg)}
.cred{margin-left:auto;font-family:var(--disp);font-variant-numeric:tabular-nums;color:var(--acc);font-size:14px;padding:5px 12px;border:1px solid rgba(255,181,71,.35);border-radius:20px;background:rgba(255,181,71,.08)}
.cred small{color:var(--mut);font-family:var(--body);font-size:12px;margin-left:5px}
#gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
#gear svg{width:17px;height:17px;fill:currentColor}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,23,40,.97);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));z-index:7}
nav button{flex:1;min-width:0;height:var(--navh);font-family:var(--disp);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav svg{width:21px;height:21px;fill:currentColor}
nav button.on{color:var(--acc)}
nav button.on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;background:var(--acc);border-radius:0 0 2px 2px}
nav button.dot::after{content:"";position:absolute;top:9px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:var(--alien);box-shadow:0 0 8px var(--alien)}

#collectAll{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);
  padding:12px 22px;border-radius:30px;background:var(--acc);color:#1a1204;font-family:var(--disp);letter-spacing:.06em;text-transform:uppercase;font-size:13.5px;white-space:nowrap;box-shadow:0 6px 24px -6px rgba(255,181,71,.6)}

#page{position:fixed;inset:0;overflow-y:auto;z-index:3;
  background:radial-gradient(90% 45% at 85% 0%,#17233f 0%,transparent 70%),radial-gradient(70% 40% at 0% 100%,#1c1538 0%,transparent 70%),var(--bg);
  padding-block:calc(env(safe-area-inset-top,0px) + 60px) calc(var(--navh) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));max-height:55%;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:4;
  padding-block:18px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));width:40px;height:40px;font-size:24px;color:var(--mut);z-index:2}
#sheet .x{top:8px}
h2{font-family:var(--disp);font-size:24px;margin:0;letter-spacing:.02em;text-wrap:balance}
.kind{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:2px}
h3{font-family:var(--disp);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:6px 0 0}
p{margin:0}.desc{color:var(--mut)}.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}
.note{padding:10px 12px;border:1px dashed var(--acc);border-radius:8px;color:var(--acc);font-size:13.5px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;padding:6px 14px;border-radius:20px;border:1px solid var(--line);font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chips button.on{border-color:var(--acc);color:var(--acc);background:rgba(255,181,71,.08)}
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#surf{display:block;width:100%;height:clamp(230px,40vh,360px);touch-action:manipulation}
.scap{position:absolute;left:14px;top:10px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ph b{font-family:var(--disp);font-size:17px}
.lvb{font-family:var(--disp);font-size:12px;color:var(--acc);white-space:nowrap}
.store{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.store>div{flex:1 1 180px;min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));border-radius:3px}
.resline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rchip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.rchip b{font-weight:600;display:flex;align-items:center;gap:7px;font-size:13px}
.rchip b i,.need i{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.stock{font-family:var(--disp);font-size:19px;font-variant-numeric:tabular-nums;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rmain{flex:1 1 150px;min-width:0}
.rmain b{font-weight:600;display:block}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
.needs{display:flex;flex-wrap:wrap;gap:4px 10px}
.rside .needs{justify-content:flex-end}
.need{font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.need.lack{color:var(--bad)}
.btn{padding:9px 16px;border-radius:8px;background:var(--acc);color:#1a1204;font-weight:600;font-size:14px}
.btn:disabled{background:var(--line);color:var(--mut);cursor:default;box-shadow:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg);font-weight:500}
.btn.big{width:100%;padding:13px;font-family:var(--disp);letter-spacing:.08em;text-transform:uppercase}
.btn.alien{background:var(--alien);color:#04201c}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{padding:8px;border:1px dashed var(--line);border-radius:10px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0;color:var(--mut);font-size:12.5px;min-height:64px}
.slot.full{border-style:solid;color:var(--fg);background:var(--panel)}
.slot span{min-width:0;overflow-wrap:anywhere}
.slot.sel{border-color:var(--acc)}
.av{width:46px;height:46px;flex:none;border-radius:10px;border:2px solid var(--rc);overflow:hidden;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 45%,#0b1020),#070b14)}
.av img.art{height:100%;object-position:50% 12%}
.av img{width:100%;height:150%;object-fit:cover;object-position:50% 0;display:block}
.ch{display:flex;gap:12px;align-items:center;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.ch>div{min-width:0;flex:1}
.ch b{font-weight:600}
.rar{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.lv{font-family:var(--disp);font-size:13px;color:var(--rc);white-space:nowrap}

/* cartes : cadre métallique selon la rareté, fenêtre d'illustration, encart de texte */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;display:flex;width:100%;min-width:0;padding:.5em;border-radius:1.2em;font-size:10.5px;line-height:1.3;text-align:left;color:var(--fg);background:var(--frame);box-shadow:0 .6em 1.6em -.8em var(--rc);overflow:hidden;isolation:isolate}
.r-c{--frame:linear-gradient(145deg,#c9d2e0,#5b667c 40%,#aab4c6 60%,#3c4558)}
.r-r{--frame:linear-gradient(145deg,#a8d4ff,#1f5fb8 40%,#7fc0ff 60%,#123a78)}
.r-e{--frame:linear-gradient(130deg,#e3c8ff,#6a2fc0,#ff8be6,#5fd9ff,#6a2fc0,#e3c8ff)}
.r-l{--frame:linear-gradient(130deg,#fff3c4,#d9972a,#fff8dc,#ffb547,#a86a12,#fff3c4)}
.card.r-e,.card.r-l{background-size:300% 300%;animation:frame 5s linear infinite,halo 2.6s ease-in-out infinite alternate}
.card.r-l{animation-duration:3.2s,1.8s}
@keyframes frame{to{background-position:300% 0}}
@keyframes halo{from{box-shadow:0 0 .6em -.2em var(--rc)}to{box-shadow:0 0 2.2em .1em var(--rc)}}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes twinkle{from{opacity:.1}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.cin{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:.8em;background:linear-gradient(170deg,#141c30,#080c16);overflow:hidden;position:relative}
.chead{display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.55em .7em;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 38%,#0b1020),#0b1020)}
.chead b{font-family:var(--disp);font-size:1.25em;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.chead i{font-style:normal;font-family:var(--disp);font-size:.95em;color:#0a0e18;background:var(--rc);border-radius:1em;padding:.1em .6em;white-space:nowrap}
.r-l .chead b{background:linear-gradient(90deg,#fff3c4,#ffb547,#fff8dc,#ffb547);-webkit-background-clip:text;background-clip:text;color:transparent}
.cart{position:relative;display:block;aspect-ratio:1/1.08;overflow:hidden;margin:0 .45em;border-radius:.4em;border:1px solid color-mix(in srgb,var(--rc) 70%,#000);background:radial-gradient(120% 80% at 50% 30%,color-mix(in srgb,var(--rc) 55%,#0b1020),#05070d 75%)}
.cart img{position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);max-width:none;pointer-events:none}
.cart img.art{left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:none}
.card.big .cart img.art{transform:translate(var(--fx,0px),var(--fy,0px)) scale(1.06)}
.ctype{display:flex;justify-content:space-between;gap:.5em;margin:.45em .45em 0;padding:.3em .6em;border-radius:.3em;background:color-mix(in srgb,var(--rc) 22%,#0b1020);font-family:var(--disp);font-size:.92em;letter-spacing:.06em;text-transform:uppercase}
.ctype em{font-style:normal;color:var(--rc);white-space:nowrap}
.ctext{display:flex;flex-direction:column;gap:.45em;flex:1;margin:.45em;padding:.6em .7em;border-radius:.4em;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.ctext span{font-style:italic;color:var(--mut)}
.ctext strong{font-weight:600}
.cfoot{display:flex;justify-content:space-between;align-items:center;padding:0 .8em .55em;color:var(--rc);letter-spacing:.12em}
.pips{display:flex;gap:.28em}
.pips i{width:.6em;height:.6em;border-radius:50%;border:1px solid var(--rc)}
.pips i.on{background:var(--rc);box-shadow:0 0 .4em var(--rc)}
/* effets : rare = reflet ; épique = reflet + hologramme + étincelles ; légendaire = tout, plus rayons et reflet sur toute la carte */
.fx,.rays,.glare{position:absolute;pointer-events:none}
.fx{inset:0}
.r-r .fx,.r-e .fx,.r-l .fx{background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:260% 100%;animation:sheen 4.5s linear infinite;mix-blend-mode:screen}
.r-e .fx::before,.r-l .fx::before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#ff5fd0,#5fd9ff,#7be0a0,#ffd76a,#ff5fd0);background-size:300% 300%;animation:frame 6s linear infinite;mix-blend-mode:color-dodge;opacity:.22}
.r-l .fx::before{opacity:.36;animation-duration:4s}
.r-e .fx::after,.r-l .fx::after{content:"";position:absolute;inset:0;animation:twinkle 1.6s ease-in-out infinite alternate;
  background:radial-gradient(.16em .16em at 16% 20%,#fff 55%,transparent 60%),radial-gradient(.12em .12em at 82% 14%,#fff 55%,transparent 60%),radial-gradient(.2em .2em at 70% 46%,#fff 55%,transparent 60%),radial-gradient(.12em .12em at 26% 62%,#fff 55%,transparent 60%),radial-gradient(.16em .16em at 88% 78%,#fff 55%,transparent 60%),radial-gradient(.14em .14em at 10% 86%,#fff 55%,transparent 60%),radial-gradient(.1em .1em at 50% 8%,#fff 55%,transparent 60%)}
.rays{inset:-60%;background:repeating-conic-gradient(from 0deg,transparent 0 9deg,rgba(255,215,106,.3) 11deg 13deg,transparent 15deg 20deg);animation:spin 20s linear infinite;mix-blend-mode:screen;opacity:.55}
.card.r-l::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.28) 45%,rgba(255,95,208,.16) 52%,transparent 65%);background-size:260% 100%;animation:sheen 3.5s linear infinite;mix-blend-mode:screen}
.glare{inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.3),transparent 50%);mix-blend-mode:screen}
.card.unk{filter:saturate(.45) brightness(.7);animation:none;box-shadow:none}
.cback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;min-height:24em;text-align:center;padding:1em;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 .6em,transparent .6em 1.2em),radial-gradient(circle,color-mix(in srgb,var(--rc) 30%,#0b1020),#080c16 70%)}
.cback b{font-family:var(--disp);font-size:5em;color:var(--rc);line-height:1}
.cback em{font-style:normal;font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.cback small{color:var(--mut)}
.card.big{font-size:clamp(13px,4.1vw,18px)}
.holo{flex:none;width:min(84%,340px);margin-top:calc(env(safe-area-inset-top,0px) + 52px);margin-bottom:20px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));touch-action:none;cursor:grab;will-change:transform}
.cards .ctext{display:none}
.cards .card{font-size:8.5px}

.pack{padding:16px;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,var(--panel2),var(--panel))}
.pack.el{border-color:var(--alien);background:linear-gradient(160deg,#143a3c,var(--panel))}
.pack h4{margin:0;font-family:var(--disp);font-size:19px}
.odds{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px}

#ov{position:fixed;inset:0;z-index:10;background:rgba(3,5,10,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:10px;justify-content:center;width:100%}
.rev{position:relative;animation:flip .7s both cubic-bezier(.2,1.2,.4,1)}
.rev .tag{display:block;text-align:center;margin-top:8px;font-family:var(--disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateY(100deg) scale(.7)}}

#viewer{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  background:radial-gradient(70% 42% at 50% 30%,color-mix(in srgb,var(--rc) 38%,#0a0f1c),#05070d 85%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
#cv{display:block;width:100%;max-width:560px;height:54%;min-height:260px;flex:none;touch-action:none;cursor:grab}
#vinfo{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#vinfo h2{font-size:28px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 76px);z-index:14;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.card,.card::after,.fx,.fx::before,.fx::after,.rays,.rev{animation:none}}
/* colonie : scène plus haute pour 11 parcelles ; atelier du vaisseau */
#surf{height:clamp(270px,44vh,420px)}
.cred.army{margin-left:0;color:var(--bad);border-color:rgba(255,122,122,.35);background:rgba(255,122,122,.08)}
.row.locked{opacity:.55}
.req{text-align:right;max-width:200px}
.need b{font-weight:500}
.hangar{position:relative;height:clamp(230px,36vh,340px);border-radius:14px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(rgba(95,217,255,.07) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,rgba(95,217,255,.07) 1px,transparent 1px) 0 0/28px 100%,radial-gradient(80% 70% at 50% 45%,#16284a,#070b14)}
#shipcv{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.hcap{position:absolute;left:12px;right:12px;bottom:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);pointer-events:none}
.check{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.check.ok{border-color:var(--ok);color:var(--ok)}
.btn:disabled,.btn.alien:disabled{background:var(--line);color:var(--mut);cursor:default}
@media (max-width:440px){.brand span{display:none}}
/* illustrations : icônes de ressources, bâtiments, packs, dos de carte */
.ric{width:20px;height:20px;object-fit:contain;flex:none}
.rchip .ric{width:28px;height:28px}
.cred{display:flex;align-items:center;gap:5px}.cred small{margin-left:0}
.bimg{width:46px;height:46px;object-fit:contain;flex:none}
.bt{display:flex;align-items:center;gap:10px;min-width:0}
.pimg{width:104px;align-self:center;filter:drop-shadow(0 8px 20px rgba(95,217,201,.45));animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(1.5deg)}}
.cback{background:linear-gradient(rgba(5,7,13,.5),rgba(5,7,13,.72)),url(art/misc/dos.webp) center/cover}
@media (prefers-reduced-motion:reduce){.pimg{animation:none}}
/* ===== refonte holographique (reprise de la maquette Claude Design) : coins coupés, cyan pour l'interface, ambre pour l'or et les niveaux ===== */
:root{--bg:#04060d;--panel:#0a1322;--panel2:#12233f;--line:rgba(63,224,255,.26);--fg:#e8f1ff;--mut:#a9bbd8;--cy:#3fe0ff;--ok:#5ef0a8;--bad:#ff6b7a;--alien:#5ef0a8;
  --c:#9fb0cc;--r:#5aa8ff;--e:#b98cff;--l:#ffb547;--navh:66px;
  --disp:'Oxanium','Chakra Petch','Trebuchet MS',sans-serif;--body:'Exo 2','Barlow','Segoe UI',system-ui,sans-serif;
  --hex:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
h2{text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 18px rgba(63,224,255,.55)}
#page{background:radial-gradient(120% 45% at 80% 0%,#0d2140 0%,transparent 70%),var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
#hud{padding-bottom:10px;background:linear-gradient(180deg,#0c1528,#04060d);border-bottom:1px solid rgba(63,224,255,.35);box-shadow:0 1px 18px rgba(63,224,255,.2)}
#hud::after{content:"";position:absolute;left:0;bottom:-1px;width:96px;height:3px;background:var(--cy);box-shadow:0 0 10px var(--cy);clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.brand{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:700;letter-spacing:.22em}
.brand svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 5px rgba(63,224,255,.8))}
.brand span{font-weight:500;font-size:9px;letter-spacing:.3em;color:var(--mut)}
.cred{height:32px;padding:0 12px 0 6px;border-radius:0;border:1.5px solid transparent;font-weight:700;font-size:15px;color:#ffd98a;
  background:linear-gradient(180deg,#33230a,#150d02) padding-box,linear-gradient(135deg,#ffe9b8,#ffb547 45%,#7a4a00) border-box;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.cred.army{color:#ffb3bb;background:linear-gradient(180deg,#330d13,#150406) padding-box,linear-gradient(135deg,#ffd3d8,#ff6b7a 45%,#7a1220) border-box}
.cred small{font-weight:400;color:var(--mut)}
#gear{position:relative;width:40px;height:40px;border:0;border-radius:0;color:var(--fg);background:linear-gradient(180deg,#3fe0ff,rgba(63,224,255,.2));clip-path:var(--hex)}
#gear::before{content:"";position:absolute;inset:1.5px;background:#0b1b2c;clip-path:var(--hex)}
#gear svg{position:relative}

nav{background:linear-gradient(180deg,#0c1528,#050912);border-top:1px solid rgba(63,224,255,.35)}
nav button{gap:2px;font-weight:600;letter-spacing:.1em}
nav button.on{color:var(--cy)}
nav button.on::before{top:-1px;left:14%;right:14%;height:4px;border-radius:0;background:var(--cy);box-shadow:0 0 14px var(--cy);clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,5px 100%)}
nav button.dot::after{top:8px;right:calc(50% - 24px);border-radius:0;transform:rotate(45deg);background:var(--ok);box-shadow:0 0 10px var(--ok)}
.nic{position:relative;width:46px;height:36px;display:grid;place-items:center}
nav button.on .nic::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#3fe0ff,rgba(63,224,255,.25));clip-path:var(--hex)}
nav button.on .nic::after{content:"";position:absolute;inset:2px;background:linear-gradient(180deg,#0f3346,#071522);clip-path:var(--hex)}
nav svg{position:relative;z-index:1;width:26px;height:26px;fill:none;stroke-linejoin:round;stroke-linecap:round}
nav .f{fill:currentColor;fill-opacity:.3}nav .d{stroke:currentColor;stroke-width:1.5}nav .a{stroke:#c3d1e8;stroke-width:1.8}
nav button.on .a{stroke:var(--acc)}nav button.on svg{filter:drop-shadow(0 0 5px rgba(63,224,255,.9))}

.btn{position:relative;overflow:hidden;min-height:44px;padding:8px 18px;border-radius:0;border:2px solid transparent;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#04121a;text-shadow:0 1px 0 rgba(255,255,255,.45);
  background:repeating-linear-gradient(115deg,rgba(4,18,26,.2) 0 4px,transparent 4px 10px) right/52px 100% no-repeat padding-box,linear-gradient(180deg,#8ff3ff,#3fe0ff 45%,#19b4d6) padding-box,linear-gradient(135deg,#d6faff,#3fe0ff 40%,#0e8fb0) border-box;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.7) 50%,transparent 58%);background-size:250% 100%;animation:sheen 3.2s linear infinite;pointer-events:none}
.btn.big{min-height:52px;font-size:15px;letter-spacing:.16em}
.btn.gold{color:#1a1204;background:repeating-linear-gradient(115deg,rgba(26,18,4,.2) 0 4px,transparent 4px 10px) right/52px 100% no-repeat padding-box,linear-gradient(180deg,#ffd98a,#ffb547 45%,#e08a12) padding-box,linear-gradient(135deg,#fff0c8,#ffb547 40%,#b06a00) border-box}
.btn.alien{color:#04160d;background:repeating-linear-gradient(115deg,rgba(4,22,13,.2) 0 4px,transparent 4px 10px) right/52px 100% no-repeat padding-box,linear-gradient(180deg,#a8f8d0,#5ef0a8 45%,#22c47c) padding-box,linear-gradient(135deg,#d8fbe9,#5ef0a8 40%,#149a60) border-box}
.btn.ghost{border-width:1.5px;color:#7af0ff;font-weight:600;text-shadow:none;background:repeating-linear-gradient(115deg,rgba(63,224,255,.16) 0 4px,transparent 4px 10px) right/52px 100% no-repeat padding-box,linear-gradient(#0b1424,#0b1424) padding-box,linear-gradient(135deg,#9ff0ff,#3fe0ff 40%,#1a6f8a) border-box}
.btn.ghost::before{opacity:.12}.btn.ghost::after{display:none}
.btn:disabled,.btn.alien:disabled,.btn.gold:disabled,.btn.ghost:disabled{color:#a9bbd8;text-shadow:none;cursor:default;background:linear-gradient(#111b30,#111b30) padding-box,linear-gradient(135deg,#5a6c92,#2a3654) border-box}
.btn:disabled::before,.btn:disabled::after{display:none}
#collectAll{border-radius:0;color:#04160d;font-weight:700;background:linear-gradient(180deg,#a8f8d0,#5ef0a8 45%,#22c47c);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:none}

.panel,.pack{position:relative;border-radius:0;border:1px solid rgba(63,224,255,.3);background:linear-gradient(160deg,rgba(20,38,70,.92),rgba(9,16,30,.92))}
.panel::before,.pack::before{content:"";position:absolute;left:-1px;top:-1px;width:34px;height:3px;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.pack.el{border-color:rgba(255,181,71,.5);background:linear-gradient(160deg,#2a1d08,rgba(9,16,30,.92))}
.pack.el::before{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.pack h4,.ph b{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em}
.rchip,.ch,.slot,.check,.note{border-radius:0}
.rchip,.ch,.check{background:rgba(9,16,30,.92)}
.slot.full{border-color:rgba(63,224,255,.4);background:rgba(9,16,30,.92)}
.av{border-radius:0;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chips button{height:36px;padding:0 16px;border-radius:0;background:rgba(63,224,255,.08);border-color:rgba(63,224,255,.4);color:var(--fg);font-weight:600;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.chips button.on{background:var(--cy);border-color:var(--cy);color:#04121a;font-weight:700}
.bar{height:6px;border-radius:0;background:#16233d}.bar i{border-radius:0;box-shadow:0 0 10px rgba(94,240,168,.7)}
.pips10{display:flex;gap:3px}.pips10 i{flex:1;height:5px;background:#1c2b49;transform:skewX(-24deg)}
.pips10 i.on{background:var(--acc);box-shadow:0 0 8px rgba(255,181,71,.8)}.pips10 i.cap{background:#2a3b62}
.scene,.hangar{border-radius:0;border:1px solid rgba(63,224,255,.35);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.scap h2{font-size:26px}
.lab{border-radius:0}
#sheet{border-radius:0;border-top:1px solid var(--acc);box-shadow:0 -8px 40px rgba(255,181,71,.25);background:linear-gradient(180deg,rgba(16,30,58,.97),rgba(7,12,24,.99))}
#toast{border-radius:0;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

/* cartes à coins coupés : le cadre passe sur ::before pour pouvoir être découpé sans perdre le halo */
.card{--cc:polygon(1.2em 0,100% 0,100% calc(100% - 1.2em),calc(100% - 1.2em) 100%,0 100%,0 1.2em);background:none;border-radius:0;overflow:visible}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--frame);background-size:300% 300%;clip-path:var(--cc)}
.card.r-e::before,.card.r-l::before{animation:frame 5s linear infinite}
.card.r-e,.card.r-l{animation:halo 2.6s ease-in-out infinite alternate}
.card.r-l{animation-duration:1.8s}
.card.r-l::after,.card .glare{clip-path:var(--cc)}
.cin{border-radius:0;clip-path:polygon(1.05em 0,100% 0,100% calc(100% - 1.05em),calc(100% - 1.05em) 100%,0 100%,0 1.05em)}
.chead{padding-left:1em}
.chead i{border-radius:0;clip-path:polygon(.4em 0,100% 0,calc(100% - .4em) 100%,0 100%);padding:.1em .7em}
.cart,.ctype,.ctext{border-radius:0}.ctext{border-width:0 0 0 2px;border-color:var(--rc)}
.pips i{border-radius:0;width:.9em;height:.35em;transform:skewX(-24deg)}
.cfoot{padding-left:1.1em}
.card.unk{animation:none}

/* ouverture de pack : pack scellé → charge (le halo final prend la couleur de la meilleure carte) → éclair → 3 cartes à retourner → séquence légendaire */
#ov.pk{display:block;padding:0;overflow:hidden;background:#04060d}
#ov.pk>*{position:absolute}
.pk-rays{left:50%;top:46%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,transparent 0 8deg,rgba(63,224,255,.12) 10deg 13deg,transparent 15deg 20deg);animation:spin 50s linear infinite}
.pk-shade{inset:0;background:radial-gradient(60% 36% at 50% 46%,rgba(90,120,255,.35),transparent 75%),linear-gradient(180deg,#04060d,transparent 28%,transparent 70%,#04060d)}
.pk-head{left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 44px);text-align:center}
.pk-head small{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.3em;color:var(--ok)}
.pk-head h2{font-size:32px;letter-spacing:.1em;text-shadow:0 0 24px rgba(185,140,255,.9)}
.pk-sub{max-width:320px;margin:4px auto 0;color:#c3d1e8;font-size:13px;opacity:0;transition:opacity .4s}.s-cards .pk-sub{opacity:1}
.pk-orb{left:calc(50% - 130px);top:calc(46% - 130px);width:260px;height:260px;border-radius:50%;border:2px dashed rgba(63,224,255,.55);animation:spin 12s linear infinite}
.pk-orb.b{left:calc(50% - 160px);top:calc(46% - 160px);width:320px;height:320px;border:1px solid rgba(185,140,255,.4);border-top-color:#b98cff;animation:spin 5s linear infinite reverse}
.pk-pack{left:calc(50% - 76px);top:calc(46% - 126px);width:152px;padding:0;animation:pkfloat 3.5s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(63,224,255,.6))}
.pk-pack img{display:block;width:100%}
.s-charge .pk-pack{animation:pkshake .12s linear infinite,pktease 1.6s linear forwards}
.pk-streaks{left:50%;top:46%;width:0;height:0;display:none}.s-charge .pk-streaks{display:block}
.pk-streaks i{position:absolute;left:0;top:0;transform:rotate(var(--a))}
.pk-streaks b{position:absolute;left:100px;top:-1px;width:130px;height:2px;transform-origin:0 50%;background:linear-gradient(90deg,#fff,rgba(63,224,255,0));animation:pkstreak .55s linear var(--d) infinite}
.pk-hint{left:0;right:0;top:calc(46% + 168px);text-align:center;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#c3d1e8;animation:blink 1.6s ease-in-out infinite}
.s-burst .pk-pack,.s-cards .pk-pack,.s-burst .pk-orb,.s-cards .pk-orb,.s-burst .pk-hint,.s-cards .pk-hint{display:none}
.pk-flash{inset:0;background:#fff;opacity:0;pointer-events:none}.s-burst .pk-flash{animation:pkflash .6s ease-out both}
.pk-cards{left:16px;right:16px;top:calc(46% - 110px);max-width:420px;margin:0 auto;display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;perspective:900px}
.s-cards .pk-cards{display:grid}
.pk-slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pkdeal .65s cubic-bezier(.2,1.3,.4,1) calc(var(--i)*.14s) both}
.pk-card{position:relative;width:100%;aspect-ratio:5/8;padding:0}
.pk-card::before{content:"";position:absolute;inset:-5px;border:3px solid var(--rc);filter:blur(6px);animation:blink 2.4s ease-in-out infinite}
.pk-slot.r-e .pk-card::before{animation-duration:1.2s}.pk-slot.r-l .pk-card::before{animation-duration:.6s;border-width:5px}
.pk-slot.on .pk-card::before{animation:none;opacity:.45}
.pk-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.5,.5,1)}
.pk-slot.on .pk-in{transform:rotateY(180deg)}
.pk-back,.pk-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pk-back{background:url(art/misc/dos.webp) center/cover;box-shadow:0 0 0 2px var(--rc)}
.pk-front{transform:rotateY(180deg)}
.pk-front .card.big{font-size:7.2px;height:100%}.pk-front .ctext,.pk-front .glare{display:none}
.pk-slot .tag{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc);opacity:0;transition:opacity .3s .45s}
.pk-slot.on .tag{opacity:1}
.pk-slot.on::after{content:"";position:absolute;left:calc(50% - 55px);top:calc(40% - 55px);width:110px;height:110px;border-radius:50%;border:3px solid var(--rc);pointer-events:none;animation:pkring .8s ease-out both}
.pk-foot{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);max-width:420px;margin:0 auto;display:none;flex-direction:column;gap:12px}
.s-cards .pk-foot{display:flex}
#ov.quake{animation:pkquake .6s linear .3s 1}
.pk-leg{inset:0;overflow:hidden;z-index:3}.pk-leg>*{position:absolute}
.lg-bg{inset:0;background:radial-gradient(62% 44% at 50% 46%,rgba(255,181,71,.6),rgba(40,22,0,.9) 55%,rgba(6,4,0,.97));animation:fadein .5s ease-out both}
.lg-rays{left:50%;top:46%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(from 0deg,transparent 0 7deg,rgba(255,215,106,.4) 9deg 12deg,transparent 14deg 20deg);animation:spin 26s linear infinite}
.lg-rays.b{width:800px;height:800px;margin:-400px 0 0 -400px;background:repeating-conic-gradient(from 6deg,transparent 0 14deg,rgba(255,255,255,.2) 15deg 17deg,transparent 18deg 30deg);animation:spin 18s linear infinite reverse}
.lg-beam{left:calc(50% - 75px);top:0;bottom:0;width:150px;background:linear-gradient(90deg,transparent,rgba(255,236,180,.95),transparent);filter:blur(8px);transform-origin:50% 100%;animation:lgbeam .9s ease-out .15s both}
.lg-ring{left:calc(50% - 100px);top:calc(46% - 100px);width:200px;height:200px;border-radius:50%;border:4px solid #ffd98a;animation:pkring 1.3s ease-out var(--d) both}
.lg-sp{bottom:-12px;width:var(--s);height:var(--s);background:#ffe9b0;box-shadow:0 0 10px 2px #ffb547;transform:rotate(45deg);animation:lgrise var(--t) linear var(--d) infinite}
.lg-title{left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);text-align:center}
.lg-title small{display:block;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.34em;color:#ffe9b0;animation:fadein .6s ease-out .9s both}
.lg-title b{display:flex;justify-content:center;font-family:var(--disp);font-size:clamp(32px,11vw,48px);letter-spacing:.06em;line-height:1.2;color:#ffd98a;text-shadow:0 0 12px #ffb547,0 0 44px #ff8a00}
.lg-title span{display:inline-block;animation:lgletter .5s cubic-bezier(.2,1.4,.4,1) var(--d) both}
.lg-card{left:50%;top:47%;width:min(60vw,240px);transform:translate(-50%,-48%);perspective:1000px;filter:drop-shadow(0 0 34px rgba(255,181,71,.95))}
.lg-spin{position:relative;transform-style:preserve-3d;animation:lgspin 1.8s cubic-bezier(.15,.75,.2,1) .35s both}
.lg-front{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lg-front .card.big{font-size:11px}.lg-front .glare{display:none}
.lg-backf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);background:url(art/misc/dos.webp) center/cover}
.lg-flash{inset:0;background:#fff6dc;pointer-events:none;animation:pkflash .8s ease-out .3s both}
.lg-foot{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px;text-align:center;animation:lgfoot .5s ease-out 3s both}
.lg-foot p{font-family:var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#fff}
@keyframes blink{50%{opacity:.35}}
@keyframes fadein{from{opacity:0}}
@keyframes pkfloat{50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes pkshake{0%{transform:translate(-3px,1px) rotate(-1.5deg)}25%{transform:translate(3px,-2px) rotate(1.5deg)}50%{transform:translate(-2px,2px) rotate(-1deg)}75%{transform:translate(2px,1px) rotate(1deg)}100%{transform:translate(-3px,-1px) rotate(-1.5deg)}}
@keyframes pktease{0%{filter:drop-shadow(0 0 14px #e8f1ff)}40%{filter:drop-shadow(0 0 26px #5aa8ff)}100%{filter:drop-shadow(0 0 60px var(--tease)) brightness(1.5)}}
@keyframes pkstreak{0%{transform:translateX(170px) scaleX(1);opacity:0}30%{opacity:1}100%{transform:translateX(10px) scaleX(.15);opacity:0}}
@keyframes pkflash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes pkring{from{transform:scale(.15);opacity:1}to{transform:scale(3.4);opacity:0}}
@keyframes pkdeal{from{transform:translateY(150px) scale(.2) rotate(-25deg);opacity:0}}
@keyframes pkquake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(4px,4px)}80%{transform:translate(-2px,1px)}}
@keyframes lgbeam{0%{transform:scaleY(0);opacity:0}40%{opacity:1}100%{transform:scaleY(1);opacity:.75}}
@keyframes lgrise{from{transform:translateY(0) rotate(45deg);opacity:1}to{transform:translateY(-110vh) rotate(45deg);opacity:0}}
@keyframes lgletter{from{opacity:0;transform:translateY(26px) scale(1.9);filter:blur(8px)}}
@keyframes lgspin{0%{transform:rotateY(1260deg) scale(.15);opacity:0}15%{opacity:1}100%{transform:rotateY(0deg) scale(1);opacity:1}}
@keyframes lgfoot{from{opacity:0;visibility:hidden}to{opacity:1;visibility:visible}}
@media (prefers-reduced-motion:reduce){.btn::after{animation:none}#ov.pk *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
/* prérequis cliquables, ligne mise en avant, silhouette des personnages sans illustration */
.row.locked{opacity:1}.row.locked .rmain,.row.locked .bimg{opacity:.6}
.req{display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:none;text-align:right}
.lnk{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border:1px solid var(--acc);background:rgba(255,181,71,.1);color:var(--acc);font-size:13px;font-weight:500;text-align:left}
.lnk i{font-style:normal;font-size:16px;line-height:1}
.row.hl{outline:2px solid var(--acc);outline-offset:3px;background:rgba(255,181,71,.08);animation:blink .9s ease-in-out 3}
button.check{width:100%;text-align:left;border-color:var(--bad);color:var(--fg)}
.panel h3{margin:10px 0 0}
.noart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.35em;padding-bottom:.7em}
.noart svg{width:46%;fill:var(--rc);opacity:.5}
.noart small{font-family:var(--disp);font-weight:600;font-size:.85em;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.av{position:relative}.av .noart{padding:0;justify-content:center}.av .noart svg{width:70%}.av .noart small{display:none}

.demo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-top:10px;border-top:1px solid var(--line)}

.fx,.fx::before,.fx::after,.rays,.glare,.card.r-l::after{mix-blend-mode:normal!important}
.r-r .fx,.r-e .fx,.r-l .fx{background-image:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%)}
.r-e .fx::before{opacity:.13}.r-l .fx::before{opacity:.18}
.rays{opacity:.4}
.card.r-l::after{background-image:linear-gradient(115deg,transparent 34%,rgba(255,240,190,.2) 47%,rgba(255,215,106,.12) 53%,transparent 64%)}
.cin{transform:translateZ(0)}

#rail{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 61px);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));width:calc(50px + env(safe-area-inset-left,0px));padding-left:env(safe-area-inset-left,0px);z-index:4;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(7,12,24,.97),rgba(7,12,24,.86));border-right:1px solid rgba(63,224,255,.3)}
.rg{display:flex;flex-direction:column;padding:3px 0;border-bottom:1px solid rgba(63,224,255,.2)}
.rg button{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:46px;padding:3px 0}
.rg img{width:24px;height:24px;object-fit:contain}
.rg span{font-family:var(--disp);font-weight:600;font-size:10.5px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
#page{padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 50px)}
/* cartes : le cadre revient en fond direct de la carte (le calque négatif animé s'affichait par-dessus sur téléphone) */
.card{background:var(--frame);background-size:300% 300%;clip-path:var(--cc);overflow:hidden;animation:none}
.card::before{display:none}
.card.r-e,.card.r-l{animation:frame 5s linear infinite}
.card.r-l{animation-duration:3.4s}
.cin{transform:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.grid .card{font-size:9.4px}
/* recherche */
.ltrack{display:flex;align-items:center;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.lk{flex:none;width:12px;height:2px;background:var(--line)}
.lnode{position:relative;flex:none;width:44px;height:48px;background:#3a4a6c;clip-path:var(--hex)}
.lnode span{position:absolute;inset:2px;display:grid;place-items:center;background:#0b1424;clip-path:var(--hex);font-family:var(--disp);font-weight:700;font-size:15px;color:var(--mut)}
.lnode.av{background:var(--bc)}.lnode.av span{color:var(--fg)}
.lnode.on{background:var(--bc)}.lnode.on span{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 45%,#0b1424),#0b1424)}
.lnode.max{background:var(--acc)}.lnode.max span{color:#1a1204;background:linear-gradient(180deg,#ffd98a,#ffb547)}
.lnode.lock{opacity:.5}
.lnode.sel{background:#fff;transform:scale(1.14);opacity:1}
.lnode.busy{animation:blink 1s ease-in-out infinite}
.chips button{padding:0 12px;font-size:11.5px}
.lnk.off{border-style:dashed;border-color:var(--mut);color:var(--mut);background:none}
</style>

const newCol=()=>{const c=Array(NPLOT).fill(null);c[QG]={t:'qg',l:1};c[6]={t:'ext0',l:1};return c};
const fresh=()=>({offset:0,res:{fer:600,silicium:150},col:{terre:newCol()},pend:{},unlocked:1,ships:{},lab:{lv:{},job:null},army:{soldat:0,drone:0},train:{},gold:150,last:Date.now(),crew:{lea:1,k7:1,orea:1,azur:1},st:{},slots:{},nextFree:0});
let S=fresh();
try{const j=JSON.parse(localStorage.getItem(KEY));
 if(j&&j.res&&j.col&&j.army)S=Object.assign(fresh(),j);
 else{const o=JSON.parse(localStorage.getItem('cosmos-colonies-v2'));if(o&&o.crew)Object.assign(S.crew,o.crew)}}catch(e){}
['lea','k7','orea','azur'].forEach(id=>{if(!S.crew[id])S.crew[id]=1});
if(S.parts){S.ships.terre={parts:S.parts,job:S.job||null};delete S.parts;delete S.job}
/* anciennes sauvegardes à 11 parcelles : on garde tous les bâtiments et on les replace sur les 15 parcelles */
for(const id in S.col){const o=S.col[id];if(o.length>=NPLOT)continue;const n=Array(NPLOT).fill(null);n[QG]=o.find(p=>p&&p.t==='qg')||{t:'qg',l:1};
 const rest=o.filter(p=>p&&p.t!=='qg'),order=[6,8,5,9,1,2,3,0,4,11,12,13,10,14];rest.forEach((p,i)=>{n[order[i]]=p});S.col[id]=n}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=()=>Date.now()+S.offset;
const slotsOf=w=>S.slots[w]||(S.slots[w]=[null,null]);
const colOf=id=>S.col[id]||(S.col[id]=newCol());
const pendOf=id=>S.pend[id]||(S.pend[id]={});
const lvlOf=id=>{const n=S.crew[id]||0;return n>=11?5:n>=7?4:n>=4?3:n>=2?2:n?1:0};
/* caractéristiques améliorables : t = Talent (+10 % du bonus par point), c = Combat (+3 de puissance d'armée par point) ; plafond = 2 × niveau */
const STAT={t:{n:'Talent',d:'+10 % sur son bonus par point'},c:{n:'Combat',d:'+3 de puissance d’armée par point'}};
const stOf=id=>S.st[id]||(S.st[id]={t:0,c:0});
const stCost=(k,n)=>{const m=Math.max(.3,1-R('stat')/100);return k==='t'?[{},Math.round(40*Math.pow(1.5,n)*m)]:[{fer:Math.round(150*Math.pow(1.5,n)*m)},0]};
const cval=c=>Math.round(c.val*(1+.25*(lvlOf(c.id)-1))*(1+.1*stOf(c.id).t)*(1+R('crew')/100));
const bonus=(w,type)=>slotsOf(w).reduce((s,id)=>{const c=id&&CH[id];return s+(c&&c.type===type?cval(c):0)},0);
const costMult=w=>Math.max(.3,1-(w==='ship'?bonus(w,'ship')+R('pcost'):bonus(w,'cost')+R('bcost'))/100);
const sumL=(id,t)=>colOf(id).reduce((s,p)=>s+(p&&p.t===t?p.l:0),0);
const maxL=(id,t)=>colOf(id).reduce((s,p)=>Math.max(s,p&&p.t===t?p.l:0),0);
const countT=(id,t)=>colOf(id).filter(p=>p&&p.t===t).length;
const busy=id=>colOf(id).filter(p=>p&&p.end).length;
const qgL=id=>colOf(id)[QG].l;
function rate(res){const[bi,ri]=LOC[res];if(bi>=S.unlocked)return 0;const id=BODIES[bi].id;return(ri?80:120)*sumL(id,'ext'+ri)*(1+(sumL(id,'labo')*10+bonus(id,'prod')+R('prod')+R(ri?'prodB':'prodA'))/100)}
const goldRate=id=>20*sumL(id,'comptoir')*(1+(bonus(id,'gold')+R('gold'))/100);
const capH=id=>Math.round((8+4*sumL(id,'depot')+bonus(id,'stock')+R('stock'))*10)/10;
const shipOf=id=>S.ships[id]||(S.ships[id]={parts:{},job:null});
const shipLvl=id=>Math.min(...Object.keys(SP).map(k=>shipOf(id).parts[k]||0));
const labLvl=()=>BODIES.slice(0,S.unlocked).reduce((m,b)=>Math.max(m,maxL(b.id,'labo')),0);
const labSum=()=>BODIES.slice(0,S.unlocked).reduce((m,b)=>m+sumL(b.id,'labo'),0);
const power=()=>Math.floor((S.army.soldat*UNITS.soldat.pw*(1+R('spow')/100)+S.army.drone*UNITS.drone.pw*(1+R('dpow')/100)+CHARS.reduce((a,c)=>a+(S.crew[c.id]?3*stOf(c.id).c:0),0)*(1+R('cbt')/100))*(1+(bonus('ship','army')+R('apow'))/100));
const armyTxt=()=>`${fmt(S.army.soldat)} soldat${S.army.soldat>1?'s':''} · ${fmt(S.army.drone)} drone${S.army.drone>1?'s':''} de combat`;
const needPower=i=>Math.ceil(20*Math.pow(2,i-1)*(1-R('need')/100));
const lotOf=(u,l)=>Math.max(1,Math.round(UNITS[u].lot*l*(1+R('lot')/100)));
function accrue(dt){if(dt<=0)return;
 for(let i=0;i<S.unlocked;i++){const b=BODIES[i],p=pendOf(b.id),h=capH(b.id);
  for(const r of b.res){const v=rate(r);if(v)p[r]=Math.min(v*h,(p[r]||0)+v*dt)}
  const c=goldRate(b.id);if(c)p.cr=Math.min(c*h,(p.cr||0)+c*dt)}}
/* avance le temps en appliquant dans l'ordre les fins de chantier, d'entraînement et de fabrication ; renvoie true si quelque chose s'est terminé */
function tick(){const t=now();let from=Math.min(S.last,t);const ev=[];
 for(let i=0;i<S.unlocked;i++)for(const p of colOf(BODIES[i].id))if(p&&p.end&&p.end<=t)ev.push([p.end,()=>{p.l++;delete p.end;delete p.dur}]);
 for(const k in S.train){const j=S.train[k];if(j.end<=t)ev.push([j.end,()=>{S.army[j.u]+=j.n;delete S.train[k]}])}
 for(const id in S.ships){const sh=S.ships[id],j=sh.job;if(j&&j.end<=t)ev.push([j.end,()=>{sh.parts[j.p]=(sh.parts[j.p]||0)+1;sh.job=null}])}
 if(S.lab.job&&S.lab.job.end<=t){const j=S.lab.job;ev.push([j.end,()=>{S.lab.lv[j.id]=(S.lab.lv[j.id]||0)+1;S.lab.job=null;RC=null}])}
 ev.sort((a,b)=>a[0]-b[0]);
 for(const e of ev){const at=Math.max(from,e[0]);accrue((at-from)/H);from=at;e[1]()}
 accrue((t-from)/H);S.last=t;return ev.length>0}
function pendInfo(id){const b=BY[id],p=pendOf(id),h=capH(id),parts=[];let pct=0;
 for(const r of b.res){const v=p[r]||0,cap=rate(r)*h;if(cap>0)pct=Math.max(pct,v/cap);if(v>=1)parts.push(`+${fmt(v)} ${RES[r].n}`)}
 const cv=p.cr||0,cc=goldRate(id)*h;if(cc>0)pct=Math.max(pct,cv/cc);if(cv>=1)parts.push(`+${fmt(cv)} or`);
 return{pct:Math.min(1,pct),txt:parts.join(' · ')}}
function collect(id){const b=BY[id],p=pendOf(id);let n=0;
 for(const r of b.res){const v=Math.floor(p[r]||0);if(v){S.res[r]=(S.res[r]||0)+v;p[r]-=v;n+=v}}
 const c=Math.floor(p.cr||0);if(c){S.gold+=c;p.cr-=c;n+=c}return n}
function bCost(id,t,L){const b=BY[id],d=BT[t],n=L?0:countT(id,t),m=costMult(id)*Math.pow(d.g,L)*Math.pow(1.5,n),c={};
 c[b.res[0]]=Math.round(d.base[0]*m);
 if(d.base[1]&&!(t==='ext1'&&!L&&!n)&&!(t==='qg'&&L<2))c[b.res[1]]=Math.round(d.base[1]*m);
 return c}
const bTime=(id,t,L)=>Math.round(30*Math.pow(L+1,1.6)*BT[t].tf*Math.max(.3,1-(bonus(id,'build')+R('build'))/100))*1000;
const bName=(b,t)=>BT[t].n||`Extracteur de ${RES[b.res[+t[3]]].n.toLowerCase()}`;

function reqs(id,t){const d=BT[t],o=[];if((d.qg||0)>qgL(id))o.push({t:'qg',s:`${BT.qg.n} niv. ${d.qg}`});
 for(const k in d.req||{})if(maxL(id,k)<d.req[k])o.push({t:k,s:`${bName(BY[id],k)} niv. ${d.req[k]}`});return o}
const lnk=(t,s)=>`<button class="lnk" data-act="goreq:${t}">${s}<i>›</i></button>`;
function pCost(id,k,L){const b=BY[id],m=Math.pow(1.6,L-1)*costMult('ship'),c={},d=SP[k];
 if(d.c[0])c[b.res[0]]=Math.round(d.c[0]*m);if(d.c[1])c[b.res[1]]=Math.round(d.c[1]*m);return c}
const pGold=L=>40*L;

function labReq(n){const o=[],lv=S.lab.lv;if(n.n>0&&(lv[n.b+n.li+(n.n-1)]||0)<3)o.push({s:`${LAB.find(b=>b.id===n.b).lines[n.li][3][n.n-1].name} niv. 3`});
 if(labLvl()<n.n+1)o.push({t:'labo',s:`Laboratoire niv. ${n.n+1}`});if(LTIER[n.n]>=S.unlocked)o.push({s:`Atteindre ${BODIES[LTIER[n.n]].name}`});return o}
function labCost(n,L){const b=BODIES[LTIER[n.n]],m=Math.pow(1.35,L)*(1+n.n*.3),c={};c[b.res[0]]=Math.round(150*m);c[b.res[1]]=Math.round(100*m);return c}
const labGold=(n,L)=>Math.round(20*(L+1)*(1+n.n*.2));
const labTime=(n,L)=>Math.round(45*Math.pow(L+1,1.4)*(1+n.n*.25)*Math.max(.4,1-.03*labSum()))*1000;
function uCost(id,u,n){const b=BY[id],c={};if(u==='soldat')c[b.res[0]]=Math.round(25*n*(1-R('scost')/100));else c[b.res[1]]=Math.round(50*n*(1-R('dcost')/100));return c}
const uGold=(u,n)=>u==='drone'?Math.round(3*n*(1-R('dcost')/100)):0;
const uTime=(u,n)=>Math.round(UNITS[u].sec*n*(1-R(u==='drone'?'dtime':'stime')/100))*1000;
const finCost=end=>Math.max(1,Math.ceil((end-now())/15000*Math.max(.3,1-R('rush')/100)));
const afford=(c,g)=>Object.keys(c).every(k=>(S.res[k]||0)>=c[k])&&S.gold>=(g||0);
const pay=(c,g)=>{for(const k in c)S.res[k]-=c[k];S.gold-=g||0};
function fmt(n){n=Math.floor(n);if(n<1e4)return n.toLocaleString('fr-FR');if(n<1e6)return(n/1e3).toFixed(1).replace('.',',')+' k';return(n/1e6).toFixed(2).replace('.',',')+' M'}
function fh(ms){const s=Math.max(0,Math.ceil(ms/1e3)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h} h ${String(m).padStart(2,'0')}`:m?`${m} min ${String(r).padStart(2,'0')}`:`${s} s`}

function whereOf(id){for(const w in S.slots)if(S.slots[w].includes(id))return w==='ship'?'Vaisseau':BY[w].name;return''}
function crewSlots(w,role){
 const types=role==='ship'?['ship','army']:['prod','cost','stock','build','gold'];
 let h=`<h3>Équipage affecté</h3><div class="slots">`;
 slotsOf(w).forEach((id,i)=>{const c=id&&CH[id],on=picker&&picker.w===w&&picker.i===i;
  h+=c?`<button class="slot full${on?' sel':''}" data-act="slot:${w}:${i}">${av(c)}<span><b>${c.n}</b><br>${EFFECT[c.type](cval(c)).replace(/ sur.*/,'')}</span></button>`
     :`<button class="slot${on?' sel':''}" data-act="slot:${w}:${i}"><span>Poste libre<br>Toucher pour affecter</span></button>`});
 h+='</div>';
 if(picker&&picker.w===w){
  const list=CHARS.filter(c=>S.crew[c.id]&&types.includes(c.type));
  if(!list.length)h+=`<p class="mut">Aucun personnage compatible pour l’instant. Ouvre des packs pour en recruter.</p>`;
  list.forEach(c=>{const at=whereOf(c.id);h+=`<button class="ch" data-act="assign:${c.id}" style="--rc:var(--${c.rar})">${av(c)}<div><b>${c.n}</b><div class="mut">${EFFECT[c.type](cval(c))}${at?` · actuellement : ${at}`:''}</div></div><span class="lv">Nv ${lvlOf(c.id)}</span></button>`});

function cyl(rt,rb,h,m,x,y,z){const g=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,20),m);g.position.set(x||0,y||0,z||0);return g}
function cone(r,h,m){return new THREE.Mesh(new THREE.ConeGeometry(r,h,12),m)}
function tor(R,r,m,arc){return new THREE.Mesh(new THREE.TorusGeometry(R,r,8,36,arc||6.2832),m)}
function buildChar(c){
 const G=new THREE.Group(),f=c.g==='f',em=c.glow||0;
 const skin=M(c.skin,{roughness:.65,emissive:em?c.skin:'#000000',emissiveIntensity:em}),s1=M(c.suit[0],{roughness:.6}),s2=M(c.suit[1],{roughness:.35,metalness:.35}),
  hair=M(c.hair[1],{roughness:.8,emissive:c.k==='ia'?c.hair[1]:'#000000',emissiveIntensity:c.k==='ia'?.35:0}),dark=M('#1a1d26'),spin=[];
 for(const s of[-1,1]){G.add(cyl(.165,.13,.95,s1,s*.18,.62,0));G.add(sph(.17,s2,s*.18,.12,.06,1,.7,1.5));G.add(cyl(.175,.175,.12,s2,s*.18,.42,0))}
 G.add(sph(f?.37:.34,s1,0,1.1,0,1,.5,.78));
 const torso=cyl(f?.34:.43,f?.26:.31,.86,s1,0,1.56,0);torso.scale.z=.68;G.add(torso);
 const belt=cyl(f?.275:.32,f?.275:.32,.1,s2,0,1.17,0);belt.scale.z=.72;G.add(belt);
 const emb=cyl(.075,.075,.04,GM(RCOL[c.rar]),0,1.74,f?.235:.285);emb.rotation.x=Math.PI/2;G.add(emb);
 const arms=[];for(const s of[-1,1]){const sx=s*(f?.41:.51);G.add(sph(.165,s2,sx,1.9,0));const a=new THREE.Group();a.position.set(sx,1.9,0);a.rotation.z=s*.13;a.add(cyl(.105,.085,.8,s1,0,-.42,0));a.add(cyl(.095,.095,.1,s2,0,-.78,0));a.add(sph(.105,skin,0,-.9,0));G.add(a);arms.push(a)}
 G.add(cyl(.11,.125,.16,skin,0,2.04,0));
 const collar=tor(.19,.055,s2);collar.position.y=2;collar.rotation.x=Math.PI/2;G.add(collar);
 const Hd=new THREE.Group();Hd.position.y=2.6;G.add(Hd);
 Hd.add(sph(.5,skin,0,0,0,1,1.04,.97));
 const visor=c.acc.includes('visor');
 if(!visor){
  for(const s of[-1,1]){const ex=s*.19,es=c.eyeS||(f?1.12:1);
   Hd.add(sph(.085*es,M('#ffffff',{roughness:.3}),ex,.02,.415,1,1.2,.5));
   Hd.add(sph(.058*es,c.eyeGlow?GM(c.eye):M(c.eye,{roughness:.2}),ex,.02,.45,1,1.2,.5));
   Hd.add(sph(.02,GM('#ffffff'),ex+.025,.055,.487));
   if(c.k==='h'){const br=new THREE.Mesh(new THREE.BoxGeometry(.15,.028,.03),hair);br.position.set(ex,.19,.44);br.rotation.z=s*(f?-.08:.1);Hd.add(br)}}
  if(!c.beard){const mo=tor(.075,.014,GM('#8a4040'),Math.PI);mo.rotation.z=Math.PI;mo.rotation.x=.2;mo.position.set(0,-.17,.458);Hd.add(mo)}}
 if(c.ears)for(const s of[-1,1]){const e=cone(.08,.4,skin);e.position.set(s*.55,.12,-.02);e.rotation.z=-s*1;Hd.add(e)}
 else if(c.k==='h')for(const s of[-1,1])Hd.add(sph(.085,skin,s*.49,0,0,.5,1,.8));
 const cap=()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.535,24,16,0,6.2832,0,1.75),hair);m.rotation.x=-.3;Hd.add(m)};
 const ring=(n,fn)=>{for(let i=0;i<n;i++)fn(i/n*6.2832,i)};
 ({short(){cap()},
  spiky(){cap();ring(7,a=>{const k=cone(.13,.36,hair);k.position.set(Math.sin(a)*.26,.5,Math.cos(a)*.26-.05);k.rotation.set(Math.cos(a)*.5,0,-Math.sin(a)*.5);Hd.add(k)});const k=cone(.14,.4,hair);k.position.set(0,.6,-.02);Hd.add(k)},
  pony(){cap();Hd.add(sph(.15,hair,0,.2,-.52));const t=cyl(.11,.03,.75,hair,0,-.2,-.68);t.rotation.x=.35;Hd.add(t);Hd.add(sph(.2,hair,.2,.36,.34,1.3,.5,.6))},
  bun(){cap();Hd.add(sph(.2,hair,0,.56,-.2));Hd.add(sph(.2,hair,-.18,.36,.34,1.3,.5,.6))},
  bob(){cap();for(const s of[-1,1])Hd.add(sph(.2,hair,s*.42,-.18,-.02,.75,1.7,1.1));Hd.add(sph(.48,hair,0,-.15,-.2,1.02,1.15,.75));Hd.add(sph(.22,hair,0,.36,.32,1.9,.5,.6))},
  long(){cap();Hd.add(sph(.5,hair,0,-.5,-.26,1.05,1.9,.5));for(const s of[-1,1])Hd.add(sph(.16,hair,s*.44,-.35,.02,.7,2.6,.9))},
  tendrils(){cap();for(let i=0;i<7;i++){const a=(i/6-.5)*3.8+Math.PI,t=cyl(.07,.035,.95,hair,Math.sin(a)*.45,-.35,Math.cos(a)*.45);t.rotation.set(-Math.cos(a)*.22,0,Math.sin(a)*.22);Hd.add(t);Hd.add(sph(.06,GM(c.eye),Math.sin(a)*.55,-.86,Math.cos(a)*.55))}},
  crest(){for(let i=0;i<4;i++)Hd.add(sph(.28-.04*i,hair,0,.44-.11*i,.14-.25*i,.14,1,1))},
  crown(){ring(7,a=>{const k=cone(.07,.5,hair);k.position.set(Math.sin(a)*.36,.55,Math.cos(a)*.36);k.rotation.set(Math.cos(a)*.3,0,-Math.sin(a)*.3);Hd.add(k);Hd.add(sph(.04,GM(c.eye),Math.sin(a)*.44,.8,Math.cos(a)*.44))})},
  none(){}})[c.hair[0]]();
 if(c.beard){const bd=new THREE.Mesh(new THREE.SphereGeometry(.515,24,12,0,6.2832,1.95,1.2),hair);bd.position.z=.03;bd.scale.y=1.06;Hd.add(bd)}
 const A={
  goggles(){const b=tor(.52,.04,dark);b.rotation.x=Math.PI/2;b.position.y=.3;Hd.add(b);for(const s of[-1,1]){const l=cyl(.12,.12,.08,M('#ffb547',{emissive:'#ffb547',emissiveIntensity:.7}),s*.19,.31,.45);l.rotation.x=Math.PI/2;Hd.add(l)}},
  glasses(){for(const s of[-1,1]){const r=tor(.115,.017,dark);r.position.set(s*.19,.02,.5);Hd.add(r)}const b=new THREE.Mesh(new THREE.BoxGeometry(.16,.02,.02),dark);b.position.set(0,.04,.5);Hd.add(b)},
  headset(){Hd.add(tor(.56,.035,dark,Math.PI));for(const s of[-1,1]){const k=cyl(.11,.11,.09,dark,s*.53,0,0);k.rotation.z=Math.PI/2;Hd.add(k)}const m=cyl(.014,.014,.34,dark,-.42,-.17,.26);m.rotation.set(1.05,0,-.5);Hd.add(m);Hd.add(sph(.04,GM('#ff7a7a'),-.3,-.2,.41))},
  visor(){const v=new THREE.Mesh(new THREE.CylinderGeometry(.515,.515,.17,24,1,true,-1,2),new THREE.MeshBasicMaterial({color:c.eye,side:THREE.DoubleSide}));v.position.y=.04;Hd.add(v);Hd.add(cyl(.012,.012,.4,dark,.4,.6,0));Hd.add(sph(.045,GM(c.eye),.4,.82,0));for(let i=0;i<3;i++)Hd.add(sph(.03,dark,(i-1)*.1,-.2,.46))},
  wrench(){const a=arms[1],h=cyl(.03,.03,.5,s2,0,-1,.2);h.rotation.x=1.15;a.add(h);const r=tor(.07,.028,s2,4.6);r.position.set(0,-1.1,.47);r.rotation.z=2.4;a.add(r)},
  tablet(){const a=arms[0],b=new THREE.Mesh(new THREE.BoxGeometry(.32,.42,.03),dark);b.position.set(.06,-.9,.16);b.rotation.x=-.5;a.add(b);const sc=new THREE.Mesh(new THREE.BoxGeometry(.27,.36,.01),GM('#6fc3ff'));sc.position.set(.06,-.89,.18);sc.rotation.x=-.5;a.add(sc)},
  cape(){const m=new THREE.Mesh(new THREE.CylinderGeometry(.48,.82,1.75,18,1,true,Math.PI/2,Math.PI),M(c.suit[1],{side:THREE.DoubleSide,roughness:.9,metalness:0}));m.position.set(0,1.12,-.02);G.add(m)},
  halo(){const h=tor(.72,.03,GM(c.eye));h.position.set(0,.08,-.3);Hd.add(h);const h2=tor(.86,.012,GM(c.eye));h2.position.set(0,.08,-.32);Hd.add(h2);spin.push([h2,'z',.4])},
  pads(){for(const s of[-1,1])G.add(sph(.25,s2,s*(f?.44:.54),1.96,0,1.15,.6,1.1))},
  pack(){const b=new THREE.Mesh(new THREE.BoxGeometry(.5,.62,.26),s2);b.position.set(0,1.6,-.36);G.add(b);for(const s of[-1,1])G.add(cyl(.07,.07,.5,GM('#ffb547'),s*.17,1.6,-.5))},
  orbs(){const o=new THREE.Group();o.position.y=2.05;for(let i=0;i<3;i++){const a=i/3*6.2832;o.add(sph(.07,GM(c.eye),Math.sin(a)*.95,Math.sin(a*2)*.15,Math.cos(a)*.95))}G.add(o);spin.push([o,'y',.9])}};
 c.acc.forEach(k=>A[k]());
 G.userData={arms,spin};return G}
function init2(){
 R2=new THREE.WebGLRenderer({canvas:$('#cv'),alpha:true,antialias:true});
 scene2=new THREE.Scene();cam2=new THREE.PerspectiveCamera(28,.8,.1,60);
 scene2.add(new THREE.HemisphereLight(0xdfe8ff,0x262a40,.95));
 const k=new THREE.DirectionalLight(0xffffff,.85);k.position.set(2.5,4,5);scene2.add(k);
 rim=new THREE.DirectionalLight(0xffffff,1.4);rim.position.set(-3,2.5,-4);scene2.add(rim);
 plat=new THREE.Group();plat.add(cyl(1.05,1.15,.14,M('#141a2a',{roughness:.4,metalness:.5}),0,-.07,0));
 platRing=tor(1.07,.03,GM('#ffffff'));platRing.rotation.x=Math.PI/2;plat.add(platRing);scene2.add(plat)}
async function makePortraits(){
 try{init2()}catch(e){R2=null;return}
 plat.visible=false;R2.setPixelRatio(1);R2.setSize(300,420,false);
 cam2.fov=26;cam2.aspect=300/420;cam2.position.set(0,2.5,5.6);cam2.lookAt(0,2.38,0);cam2.updateProjectionMatrix();
 let i=0;for(const c of CHARS){if(c.art)continue;
  const g=chars[c.id]=buildChar(c);g.rotation.y=(i++%2?.32:-.32);scene2.add(g);rim.color.set(RCOL[c.rar]);
  R2.render(scene2,cam2);try{PORT[c.id]=$('#cv').toDataURL('image/webp',.9)}catch(e){}
  scene2.remove(g);g.rotation.y=0;await wait(12)}
 if(view!=='sys'&&!vOpen)render()}
function sizeViewer(){const cv=$('#cv'),w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;R2.setPixelRatio(Math.min(devicePixelRatio||1,2));R2.setSize(w,h,false);
 cam2.fov=30;cam2.aspect=w/h;const dz=Math.max(9.4,9.4*.95/cam2.aspect*.62);cam2.position.set(0,1.95,dz);cam2.lookAt(0,1.62,0);cam2.updateProjectionMatrix()}
function vInfo(id){const c=CH[id],art=true,n=S.crew[id]||0,L=lvlOf(id),at=whereOf(id),st=stOf(id),cap=2*L;
 let h=(art?'':`<div class="rar">${RAR[c.rar]}</div><h2>${c.n}</h2><div class="kind">${c.job}</div><p class="desc">${c.bio}</p>`)+`<div class="panel"><b>${EFFECT[c.type](cval(c))}</b><span class="mut">Niveau ${L} / 5${L<5?` · ${n} / ${LVN[L]} cartes pour le niveau ${L+1}`:' · niveau maximum'}</span><span class="mut">${at?`Affectation : ${at}`:'Non affecté. Choisis un poste depuis une colonie ou le vaisseau.'}</span></div>`;
 h+=`<div class="panel"><div class="ph"><b>Caractéristiques</b><span class="lvb">Plafond ${cap} au niveau ${L}</span></div>`;
 for(const k in STAT){const v=st[k],[co,g]=stCost(k,v);
  h+=`<div class="row"><div class="rmain"><b>${STAT[k].n} · ${v} / 10</b><span class="mut">${STAT[k].d}</span>${pips10(v,cap)}</div><div class="rside">${v>=10?'<span class="ok">Maximum</span>':v>=cap?`<span class="mut req">Monte le personnage au niveau ${L+1}</span>`:`<div class="needs">${costHTML(co,g)}</div><button class="btn" data-act="stat:${id}:${k}" data-cost='${JSON.stringify(co)}' data-gold="${g}">Améliorer</button>`}</div></div>`}
 return h+`</div>${c.model?`<button class="btn big ghost" data-act="v3d:${id}">Figurine 3D / carte</button>`:''}<p class="mut">${art?'Glisse le doigt sur la carte pour l’incliner.':'Glisse pour faire tourner le personnage.'}</p>`}
function openViewer(id){
 const c=CH[id],art=true;
 vArt=art;$('#cv').hidden=art;const ho=$('#holo');ho.hidden=!art;
 if(art)ho.innerHTML=card(c,true,true);
 else{if(vCur)scene2.remove(vCur);vCur=chars[id];scene2.add(vCur);plat.visible=true;platRing.material.color.set(RCOL[c.rar]);rim.color.set(RCOL[c.rar])}
 const V=$('#viewer');V.style.setProperty('--rc',`var(--${c.rar})`);$('#vinfo').innerHTML=vInfo(id);
 V.hidden=false;V.scrollTop=0;vOpen=true;vRot=-.5;if(!art)sizeViewer()}
function show3D(id){
 const c=CH[id];
 if(!vArt){vArt=true;$('#cv').hidden=true;$('#holo').hidden=false;return}
 if(!R2){toast('Aperçu 3D indisponible sur cet appareil');return}
 const go=()=>{if(!vOpen)return;if(vCur)scene2.remove(vCur);vCur=chars[id];scene2.add(vCur);plat.visible=true;platRing.material.color.set(RCOL[c.rar]);
  vArt=false;$('#holo').hidden=true;$('#cv').hidden=false;$('#viewer').scrollTop=0;sizeViewer()};
 if(chars[id])return go();
 toast('Chargement de la figurine…');
 const b64=(t,T)=>{const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new T(u.buffer)};
 fetch(c.model).then(r=>r.json()).then(j=>{
  const mat=new THREE.ShaderMaterial({uniforms:{uC:{value:new THREE.Color(RCOL[c.rar]).lerp(new THREE.Color('#ffffff'),.2)},uT:{value:0}},
   vertexShader:'varying vec3 vN;varying vec3 vV;varying float vY;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vV=normalize(-mv.xyz);vY=position.y;gl_Position=projectionMatrix*mv;}',
   fragmentShader:'uniform vec3 uC;uniform float uT;varying vec3 vN;varying vec3 vV;varying float vY;void main(){vec3 n=normalize(vN);float f=pow(1.0-abs(dot(n,normalize(vV))),2.5);float l=max(dot(n,normalize(vec3(0.45,0.6,0.65))),0.0);float sc=0.88+0.12*sin(vY*140.0-uT*3.0);vec3 base=mix(vec3(0.05,0.07,0.12),uC,0.18+0.62*l);vec3 col=(base+uC*f*1.3+vec3(1.0)*pow(l,12.0)*0.25)*sc;gl_FragColor=vec4(col,1.0);}'});
  const q=b64(j.pos,Uint16Array),pos=new Float32Array(q.length);
  for(let i=0;i<q.length;i++){const a=i%3;pos[i]=j.min[a]+q[i]/65535*(j.max[a]-j.min[a])}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setIndex(new THREE.BufferAttribute(b64(j.idx,Uint32Array),1));
  if(j.uv)geo.setAttribute('uv',new THREE.BufferAttribute(b64(j.uv,Uint16Array),2,true));
  if(j.nrm)geo.setAttribute('normal',new THREE.BufferAttribute(b64(j.nrm,Int8Array),3,true));else geo.computeVertexNormals();
  let mt=mat;if(j.tex&&j.uv){const tx=new THREE.TextureLoader().load(j.tex);tx.flipY=false;tx.anisotropy=4;mt=new THREE.MeshStandardMaterial({map:tx,roughness:.8,metalness:0,side:THREE.DoubleSide})}
  const k=3.2/(j.max[1]-j.min[1]),m=new THREE.Mesh(geo,mt),G=new THREE.Group();
  m.scale.setScalar(k);m.position.set(-(j.min[0]+j.max[0])/2*k,-j.min[1]*k,-(j.min[2]+j.max[2])/2*k);G.add(m);
  G.userData={arms:[new THREE.Object3D(),new THREE.Object3D()],spin:[],mat:mt===mat?mat:null};chars[id]=G;go()}).catch(()=>toast('Impossible de charger la figurine'))}
function closeViewer(){vOpen=false;$('#viewer').hidden=true}
function drawViewer(t){
 if(vArt){const st=$('#holo').style,ry=vTilt?vTilt[0]:Math.sin(t*.8)*9,rx=vTilt?vTilt[1]:Math.cos(t*.6)*5;
  vS[0]+=(ry-vS[0])*.12;vS[1]+=(rx-vS[1])*.12;const a=vS[0],b=vS[1];
  st.setProperty('--ry',a+'deg');st.setProperty('--rx',b+'deg');st.setProperty('--fx',a*.9+'px');st.setProperty('--fy',-b*.9+'px');st.setProperty('--bx',-a*.7+'px');st.setProperty('--by',b*.7+'px');st.setProperty('--gx',50+a*3+'%');st.setProperty('--gy',35-b*4+'%');return}
 if(!vCur)return;if(!vDrag)vRot+=.006;
 vCur.rotation.y=vRot;vCur.position.y=Math.sin(t*2)*.025;plat.rotation.y=-t*.2;
 const u=vCur.userData;if(u.mat)u.mat.uniforms.uT.value=t;u.arms[0].rotation.x=Math.sin(t*2)*.07;u.arms[1].rotation.x=-Math.sin(t*2)*.07;
 for(const s of u.spin)s[0].rotation[s[1]]=t*s[2];
 R2.render(scene2,cam2)}
const ho=$('#holo');
const tilt=e=>{const r=ho.getBoundingClientRect();vTilt=[((e.clientX-r.left)/r.width-.5)*36,-((e.clientY-r.top)/r.height-.5)*28]};
ho.addEventListener('pointerdown',e=>{try{ho.setPointerCapture(e.pointerId)}catch(_){}tilt(e)});
ho.addEventListener('pointermove',e=>{if(vTilt)tilt(e)});
const tEnd=()=>{vTilt=null};ho.addEventListener('pointerup',tEnd);ho.addEventListener('pointercancel',tEnd);
const cv=$('#cv');
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}vDrag=e.clientX});
cv.addEventListener('pointermove',e=>{if(vDrag===null)return;vRot+=(e.clientX-vDrag)*.012;vDrag=e.clientX});
const vEnd=()=>{vDrag=null};cv.addEventListener('pointerup',vEnd);cv.addEventListener('pointercancel',vEnd);

function frame(ms){requestAnimationFrame(frame);const t=ms/1e3;
 if(vOpen){drawViewer(t);return}
 if(view==='sys'){place(t);camUpdate();renderer.render(scene,cam);labels()}
 else if(view==='col')drawSurface(t);
 else if(view==='ship'&&R3)drawShip(t)}

/* ---------- démarrage ---------- */
resize();syncLocks();place(0);initShip();if(R3)loadShip();tick();syncShip();
if(!BY[sel]||BODIES.indexOf(BY[sel])>=S.unlocked)sel='terre';
openColony(sel);
addEventListener('resize',()=>{if(view==='ship')mountShip()});
let n=0;setInterval(()=>{if(tick()){syncShip();save();if(!vOpen&&$('#ov').hidden)render();else live()}else live();if(++n%10===0)save()},1000);
document.addEventListener('visibilitychange',()=>{tick();syncShip();save();if(!vOpen&&$('#ov').hidden)render()});
requestAnimationFrame(frame);
setTimeout(()=>{try{init2()}catch(e){R2=null}},60);
})();
